version: '3'
services:
  cognito-idp:
    image: motoserver/moto:latest
    container_name: cognito-idp-local
    ports:
      - "5000:5000"
  db:
    build: ./postgreDb/
    container_name: postgre-db-local
    ports:
      - "5432:5432"
    volumes:
      - ./postgreDb/script:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_DB: "DOJINLIB"
      POSTGRES_SCHEMA: "djla"
      POSTGRES_USER: 'user'
      POSTGRES_PASSWORD: 'localuserpass'
      TZ: "Asia/Tokyo"
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: minio-local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio:/data
    environment:
      MINIO_ROOT_USER: "minio_local_root"
      MINIO_ROOT_PASSWORD: "minio_local_password"
    command: server /data --console-address :9001